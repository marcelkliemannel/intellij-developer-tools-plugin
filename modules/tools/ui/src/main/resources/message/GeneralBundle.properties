regex-options.unicode-case.description=The <code>case insensitive</code> option will use the Unicode standard.
regex-options.multiline.title=Multiline
regex-options.multiline.description=The expressions <code>^</code> and <code>$</code> match just after or just before a line terminator or the end of the input sequence.
regex-options.dotall.title=Dotall
regex-options.dotall.description=The expression <code>.</code> will also match line terminators.
regex-options.canon-eq.title=Canonical equivalence
regex-options.canon-eq.description=Two characters are considered a match only if their full canonical decompositions match.
regex-options.unix-lines.title=Unix line endings
regex-options.unix-lines.description=Only the <code>\\n</code> line terminator is recognized in the behavior of <code>.</code>, <code>^</code>, and <code>$</code>.
regex-options.literal.title=Literal parsing of the pattern
regex-options.literal.description=The input string that specifies the pattern will be treated as a sequence of literal characters.
regex-options.comments.title=Permit whitespace and comments in pattern
regex-options.comments.description=Whitespace will be ignored, and embedded comments starting with <code>#</code> are ignored until the end of a line.
