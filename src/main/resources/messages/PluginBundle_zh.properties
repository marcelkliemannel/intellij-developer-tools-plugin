plugin.name=开发者工具
plugin.description=<p>Developer Tools 将常用开发实用工具直接集成到基于 IntelliJ 的 IDE 中。它将编码数据、转换文本、验证 JSON、生成标识符、检查归档、格式化代码和 SQL、检查证书等常见任务保留在 IDE 内，因此无需切换到单独的 Web 工具或命令行片段。</p><p>插件图标由 <a href="https://www.svgrepo.com/svg/489187/toolbox">Gabriele Malaspina</a> 提供。</p><h2>主要功能</h2><ul><li>JWT 编码器/解码器</li><li>Base32、Base64、URL Base64、MIME Base64、URL 和 ASCII 编码器/解码器</li><li>HTML 实体、Java 字符串、JSON、CSV、XML 和转义序列的文本转义与反转义</li><li>正则表达式匹配器</li><li>UUID、ULID、Nano ID、密码、二维码/条形码、Lorem Ipsum 和 ASCII 艺术生成器</li><li>文本排序</li><li>文本大小写转换</li><li>文本差异查看器</li><li>文本格式转换</li><li>文本统计</li><li>文本筛选</li><li>JSON Path 解析器</li><li>JSON Schema 验证器</li><li>哈希和 HMAC</li><li>HTTP 服务器 (WireMock)</li><li>ZIP、TAR、JAR、7z 和其他格式的归档查看器与提取器</li><li>用于 Unix 时间戳、格式化和解析的日期与时间工具</li><li>时间、数据大小和传输速率的单位转换器</li><li>代码样式格式化</li><li>SQL 格式化</li><li>CLI 命令转换</li><li>颜色选择器</li><li>获取、分析和导出服务器证书</li><li>笔记</li></ul><h2>集成</h2><p>完整工具箱可在持久化工具窗口和独立对话框中使用。工具可以拥有多个命名工作台，因此可以为不同任务保留独立输入和配置。常用文本操作也可从编辑器弹出菜单和意图操作中使用；根据操作不同，它们作用于选中文本或光标处的 Java/Kotlin 字符串或标识符。</p><p>插件设置位于 IntelliJ IDEA 设置/偏好设置中的 <b>工具 | Developer Tools</b>。</p><h3>工具窗口</h3><p>工具窗口位于 <b>视图 | 工具窗口 | Developer Tools</b>。输入、所选工具、展开的菜单组和工具配置按项目存储。</p><h3>对话框</h3><p>可从 IntelliJ IDEA 主菜单 <b>工具 | Developer Tools</b> 打开对话框。</p><p>要将“打开对话框”操作添加到主工具栏，请在 IntelliJ IDEA 设置/偏好设置中的 <b>工具 | Developer Tools</b> 启用它，或通过 <b>自定义工具栏... | 添加操作... | Developer Tools</b> 手动添加。</p><p>对话框输入、所选工具、展开的菜单组和工具配置存储在应用程序级别。</p>
