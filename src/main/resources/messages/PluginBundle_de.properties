plugin.name=Developer Tools
plugin.description=<p>Developer Tools bringt eine praktische Sammlung allt\u00e4glicher Entwicklungswerkzeuge direkt in IntelliJ-basierte IDEs. H\u00e4ufige Aufgaben wie das Kodieren von Daten, Transformieren von Text, Validieren von JSON, Generieren von Bezeichnern, Pr\u00fcfen von Archiven, Formatieren von Code und SQL sowie Pr\u00fcfen von Zertifikaten bleiben dadurch in der IDE, ohne separate Webtools oder Kommandozeilen-Snippets zu verwenden.</p><p>Plugin-Symbol von <a href="https://www.svgrepo.com/svg/489187/toolbox">Gabriele Malaspina</a>.</p><h2>Wichtige Funktionen</h2><ul><li>JWT Encoder/Decoder</li><li>Base32, Base64, URL Base64, MIME Base64, URL und ASCII Encoder/Decoder</li><li>Escapen und Unescapen von Text f\u00fcr HTML-Entit\u00e4ten, Java-Strings, JSON, CSV, XML und Escape-Sequenzen</li><li>Matcher f\u00fcr regul\u00e4re Ausdr\u00fccke</li><li>Generatoren f\u00fcr UUID, ULID, Nano ID, Passw\u00f6rter, QR-Code/Barcode, Lorem Ipsum und ASCII-Art</li><li>Textsortierung</li><li>Text-Case-Transformation</li><li>Text-Diff-Viewer</li><li>Textformat-Konvertierung</li><li>Textstatistik</li><li>Textfilter</li><li>JSON-Path-Parser</li><li>JSON-Schema-Validator</li><li>Hashing und HMAC</li><li>HTTP-Server (WireMock)</li><li>Archivbetrachter und Extraktor f\u00fcr ZIP, TAR, JAR, 7z und andere Formate</li><li>Datums- und Zeitwerkzeuge f\u00fcr Unix-Timestamps, Formatierung und Parsing</li><li>Einheitenkonverter f\u00fcr Zeit, Datengr\u00f6\u00dfe und \u00dcbertragungsrate</li><li>Code-Style-Formatierung</li><li>SQL-Formatierung</li><li>CLI-Befehlskonvertierung</li><li>Farbauswahl</li><li>Abrufen, Analysieren und Exportieren von Serverzertifikaten</li><li>Notizen</li></ul><h2>Integration</h2><p>Die vollst\u00e4ndige Werkzeugsammlung ist sowohl in einem persistenten Toolfenster als auch in einem eigenst\u00e4ndigen Dialog verf\u00fcgbar. Werkzeuge k\u00f6nnen mehrere benannte Arbeitsbereiche haben, sodass getrennte Eingaben und Konfigurationen f\u00fcr unterschiedliche Aufgaben erhalten bleiben. H\u00e4ufig verwendete Textoperationen sind au\u00dferdem im Editor-Kontextmen\u00fc und als Intentions verf\u00fcgbar; je nach Aktion arbeiten sie mit ausgew\u00e4hltem Text oder mit dem Java-/Kotlin-String beziehungsweise Bezeichner am Caret.</p><p>Plugin-Einstellungen sind in den Einstellungen von IntelliJ IDEA unter <b>Tools | Developer Tools</b> verf\u00fcgbar.</p><h3>Toolfenster</h3><p>Das Toolfenster ist unter <b>View | Tool Windows | Developer Tools</b> verf\u00fcgbar. Eingaben, ausgew\u00e4hlte Werkzeuge, aufgeklappte Men\u00fcgruppen und Werkzeugkonfigurationen werden pro Projekt gespeichert.</p><h3>Dialog</h3><p>Der Dialog ist im Hauptmen\u00fc von IntelliJ IDEA unter <b>Tools | Developer Tools</b> verf\u00fcgbar.</p><p>Um die Aktion "Open Dialog" zur Hauptsymbolleiste hinzuzuf\u00fcgen, aktivieren Sie sie in den Einstellungen von IntelliJ IDEA unter <b>Tools | Developer Tools</b>, oder f\u00fcgen Sie sie manuell \u00fcber <b>Customize Toolbar... | Add Actions... | Developer Tools</b> hinzu.</p><p>Dialogeingaben, ausgew\u00e4hlte Werkzeuge, aufgeklappte Men\u00fcgruppen und Werkzeugkonfigurationen werden auf Anwendungsebene gespeichert.</p>
